spring:
  application:
    name: ai-troubleshooting-assistant

  # Day 4: the Postgres + pgvector container from docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/troubleshooting
    username: postgres
    password: dev

  ai:
    mcp:
      server:
        # Off for normal runs (IntelliJ, tests). The "mcp" profile turns it on for Claude Desktop.
        enabled: false

    openai:
      # Read from the OPENAI_API_KEY environment variable. Never put the real key in this file.
      api-key: ${OPENAI_API_KEY}
      embedding:
        model: text-embedding-3-small   # cheaper and better than the old default (ada-002)

    model:
      chat: none                         # no chat model until Day 5

    vectorstore:
      pgvector:
        initialize-schema: true          # create the vector extension + vector_store table if missing
        index-type: HNSW                 # approximate nearest-neighbour index (fast at scale)
        distance-type: COSINE_DISTANCE   # compare by direction = meaning
        dimensions: 1536                 # must match the embedding model's output size

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Our own settings
app:
  incidents:
    index-on-startup: true       # embed + store incidents at startup if not already stored
    similarity-threshold: 0.4    # tuned from test scores: correct matches ~0.48-0.59, noise ~0.30-0.38
